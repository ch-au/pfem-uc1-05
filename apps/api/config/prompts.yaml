# AI Prompt Configuration
# Each prompt can be loaded from Langfuse or a local fallback file
# Model can be specified per prompt - falls back to defaults.default_model if not set

prompts:
  # Knowledge Base Generator - Generates SQL queries for quiz topics
  # This is the FIRST step in quiz generation - creates facts from database
  knowledge-base:
    langfuse_name: 'uc1/production/knowledge_base'
    langfuse_label: 'production'
    fallback_file: 'knowledge-base.txt'
    model: 'anthropic/claude-opus-4.5'
    llm_config:
      temperature: 0
      max_tokens: 15000
      response_format: 'json'
    description: 'Generates SQL queries for a given quiz topic to build knowledge base'

  # Quiz Question Generator - Creates quiz questions from knowledge base
  # SECOND step - uses facts from knowledge base to create questions
  quiz-question-generator:
    langfuse_name: 'uc1/production/Quiz_Fragen'
    langfuse_label: 'production'
    fallback_file: 'quiz-question-generator.txt'
    model: 'google/gemini-2.5-flash-preview-09-2025'
    llm_config:
      temperature: 0.7
      max_tokens: 10000
      response_format: 'json'
    description: 'Generates multiple-choice quiz questions based on FSV Mainz 05 data'

  # Quiz Answer Generator - Generates alternative wrong answers
  # THIRD step - creates plausible incorrect alternatives for each question
  quiz-answer-generator:
    langfuse_name: 'uc1/production/Quiz_Antworten'
    langfuse_label: 'production'
    fallback_file: 'quiz-answer-generator.txt'
    model: 'google/gemini-3-flash-preview'
    llm_config:
      temperature: 0.7
      max_tokens: 10000
      response_format: 'json'
    description: 'Generates plausible incorrect alternatives for quiz questions'

  # Chat SQL Generator - Converts user questions to SQL
  chat-sql-generator:
    langfuse_name: 'uc1/production/SQL_Interface'
    langfuse_label: 'production'
    fallback_file: 'chat-sql-generator.txt'
    model: 'anthropic/claude-opus-4.5'
    llm_config:
      temperature: 0.1
      max_tokens: 20000
      response_format: 'json'
    description: 'Generates SQL queries from natural language questions about FSV Mainz 05 history'

  # Chat Answer Formatter - Formats SQL results into natural language
  chat-answer-formatter:
    langfuse_name: 'uc1/production/Chatbot_Antwort'
    langfuse_label: 'production'
    fallback_file: 'chat-answer-formatter.txt'
    model: 'google/gemini-3-flash-preview'
    llm_config:
      temperature: 0.7
      max_tokens: 10000
      response_format: 'json'
    description: 'Formats SQL query results into conversational German answers'

# Embeddings configuration for semantic search
embeddings:
  model: 'text-embedding-3-large'
  provider: 'openai'
  dimensions: 3072
  description: 'Text embeddings for semantic player/team name matching'

# Global defaults
defaults:
  default_model: 'google/gemini-3-flash-preview'
  fallback_dir: '../../../../../prompts/fallback'
  langfuse_enabled: true
  retry_on_error: true
  max_retries: 2

# Available models for reference
available_models:
  openrouter:
    - 'google/gemini-2.5-flash-preview-09-2025'
    - 'google/gemini-2.0-flash-001'
    - 'google/gemini-3-flash-preview'
    - 'anthropic/claude-3.5-sonnet'
    - 'anthropic/claude-3-opus'
    - 'openai/gpt-4o'
    - 'openai/gpt-4o-mini'
    - 'meta-llama/llama-3.1-70b-instruct'
